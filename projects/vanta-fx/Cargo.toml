[package]
name = "horizon-boost-rust"
version = "7.9.0-dev"
edition = "2024"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "=0.33.1"
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in", "spv-in", "spv-out", "hlsl-out"] }
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
windows = { version = "=0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Graphics_DirectX", "Foundation"] }

[profile.dev]
opt-level = 1
debug = 0
incremental = false
[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 8
strip = "symbols"
