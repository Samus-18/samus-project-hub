<style>
.ribbon-a{animation:driftA 29s ease-in-out infinite alternate;transform-origin:50% 30%}.ribbon-b{animation:driftB 37s ease-in-out infinite alternate;transform-origin:50% 25%}.ribbon-c{animation:driftC 23s ease-in-out infinite alternate}.water-glow{animation:reflection 12s ease-in-out infinite alternate;transform-origin:50% 75%}
@keyframes driftA{0%{transform:translate(-2%,1%) scaleX(1)}50%{transform:translate(1%,-2%) scaleX(1.03)}100%{transform:translate(2%,2%) scaleX(.98)}}
@keyframes driftB{0%{transform:translate(2%,-1%) scaleX(.98)}50%{transform:translate(-1%,2%) scaleX(1.04)}100%{transform:translate(-2%,-1%) scaleX(1)}}
@keyframes driftC{0%{transform:translateY(-10px);opacity:.45}100%{transform:translateY(18px);opacity:.9}}
@keyframes reflection{0%{transform:translateY(-3px) scaleY(.92);opacity:.48}100%{transform:translateY(12px) scaleY(1.08);opacity:.85}}
@media(prefers-reduced-motion:reduce){.ribbon-a,.ribbon-b,.ribbon-c,.water-glow{animation:none}}
</style>
</svg>
